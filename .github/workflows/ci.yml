name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ops-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ops Engine lifecycle tests
        run: node ops-engine/test/run.js
      - name: Widget and site syntax
        run: |
          node --check chat-receptionist/widget.js
          node --check booking-site/app.js

  comms-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comms-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy src
      - run: pytest -q

  domain-rag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: domain-rag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools  # runner images ship an old setuptools with known CVEs
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy src
      - run: pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable

  onchain-escrow:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    defaults:
      run:
        working-directory: onchain-escrow
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Lint
        run: forge lint src
      - name: Test (unit, fuzz 10k runs, invariants 256 x 500)
        run: forge test -vvv
      - name: Coverage (default fuzz settings; the heavy run above already tested depth)
        run: FOUNDRY_PROFILE=default forge coverage --ir-minimum --report summary
